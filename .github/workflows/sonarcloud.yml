name: SonarCloud

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

jobs:
    sonarcloud:
        uses: reactiveui/actions-common/.github/workflows/workflow-common-sonarcloud.yml@main
        with:
            srcFolder: src
            solutionFile: Akavache.slnx
            minverMinimumMajorMinor: '12.1'
            sonarProjectKey: reactiveui_Akavache
            sonarOrganization: reactiveui
            installWorkloads: true
            testProjects: tests/**/*.csproj
            sonarExclusions: '**/tests/**,**/benchmarks/**,**/samples/**,**/TestResults/**'
            sonarCoverageExclusions: '**/tests/**,**/benchmarks/**,**/samples/**,**/*Tests/**,**/*Tests.cs,**/Generated/**,**/*.g.cs'
            sonarCpdExclusions: '**/tests/**,**/benchmarks/**,**/samples/**'
            sonarTestExclusions: '**/tests/**,**/benchmarks/**,**/samples/**'
            testTimeout: '15m'
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
