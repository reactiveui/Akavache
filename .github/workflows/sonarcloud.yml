name: SonarCloud

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

jobs:
    sonarcloud:
        uses: reactiveui/actions-common/.github/workflows/workflow-common-sonarcloud.yml@main
        with:
            srcFolder: src
            solutionFile: Akavache.slnx
            minverMinimumMajorMinor: '12.1'
            sonarProjectKey: reactiveui_Akavache
            sonarOrganization: reactiveui
            installWorkloads: true
            sonarExclusions: '**/tests/**,**/benchmarks/**,**/samples/**,**/compat/**,**/TestResults/**'
            # The compat writer/reader are standalone executables run outside the test harness, so no collector instruments them.
            sonarCoverageExclusions: '**/tests/**,**/benchmarks/**,**/samples/**,**/compat/**,**/*Tests/**,**/*Tests.cs,**/Generated/**,**/*.g.cs'
            sonarCpdExclusions: '**/tests/**,**/benchmarks/**,**/samples/**,**/compat/**'
            sonarTestExclusions: '**/tests/**,**/benchmarks/**,**/samples/**,**/compat/**'
            testTimeout: '15m'
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
